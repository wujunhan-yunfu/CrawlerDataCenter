[project]
name = "crawler-data-center"
version = "0.1.0"
description = "爬虫数据中心控制面: 多租户工作空间/爬虫项目管理 + 开发容器编排 + 调度 + webhook 接收 + 数据入库"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "email-validator>=2.2",
    "PyJWT>=2.10",
    "bcrypt>=4.2",
    "cryptography>=43.0",
    "httpx>=0.28",
    "croniter>=4.0",
    "python-multipart>=0.0.20",
    "motor>=3.6",
]

[project.optional-dependencies]
kubernetes = ["kubernetes>=31.0"]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "fakeredis>=2.26",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/main.py", "backend/worker.py"]

[tool.coverage.report]
fail_under = 85
skip_covered = true
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"